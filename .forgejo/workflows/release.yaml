on:
  workflow_dispatch:
    inputs:
      version:
        description: "version to use"
        required: true
        type: string
env:
  FORGE_FQDN: git.myservermanager.com
  FORGE_URL: https://git.myservermanager.com
  FORGE_REPOSITORY_NAME: varakh/yafe
jobs:
  release:
    runs-on: native
    steps:
      - name: Checkout
        uses: actions/checkout@v4.4.0

      - name: Native - build
        shell: bash
        run: |
          nix develop --command bash -c "make clean dependencies build-all"

      - name: OCI - Login
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.FORGE_FQDN }}
          username: ${{ secrets.FORGE_USER }}
          password: ${{ secrets.FORGE_TOKEN }}

      - name: OCI - prepare
        uses: docker/setup-buildx-action@v4.4.1

      - name: OCI - build and push
        shell: bash
        run: |
          docker buildx build --push --no-cache -t git.myservermanager.com/varakh/yafe:${{ inputs.version }} -t git.myservermanager.com/varakh/yafe:latest -f Dockerfile .

      - name: Upload artifacts
        uses: https://git.myservermanager.com/msm/forgejo-actions-forgejo-release@main
        with:
          url: ${{ env.FORGE_URL }}
          repo: ${{ env.FORGE_REPOSITORY_NAME }}
          token: ${{ secrets.FORGE_TOKEN }}
          tag: ${{ inputs.version }}
          direction: upload
          release-dir: bin
